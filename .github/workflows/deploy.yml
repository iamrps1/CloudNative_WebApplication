name: CI/CD Pipeline - Build, Scan, Push & Deploy

on:
  push:
    branches: [main]

env:
  ECR_REPO_NAME: cloudnative-webapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    - name: Snyk Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: test

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and Push Docker Image
      run: |
        docker build -t $ECR_REPO_NAME .
        docker tag $ECR_REPO_NAME:latest ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPO_NAME }}:latest
        docker push ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPO_NAME }}:latest

    - name: Notify about ECS Deployment (manual for now)
      run: echo "Login to AWS ECS Console > Update Service to pull latest image"
